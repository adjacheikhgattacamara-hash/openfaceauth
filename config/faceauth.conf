# Configuration de FaceAuth : /etc/faceauth/faceauth.conf
# Pas de redémarrage nécessaire : le fichier est relu à chaque authentification.
# Les commentaires doivent rester sur leur propre ligne.

[general]
# Mettre à false pour désactiver temporairement FaceAuth (le mot de passe reste utilisé).
enabled = true
# Écrire les résultats (succès / échecs) dans le journal système : journalctl -t faceauth
log = true

[camera]
# Numéro de la caméra : 0 = /dev/video0. Liste : v4l2-ctl --list-devices
index = 0
# Alternative à index : chemin du périphérique (utile pour une caméra infrarouge
# ou pour fixer la caméra quel que soit l'ordre de branchement).
# Exemple : device = /dev/v4l/by-id/usb-Chicony_HP_Webcam-video-index0
# Laisse vide pour utiliser index.
device =

[recognition]
# Distance maximale entre ton visage et les échantillons enregistrés.
# Plus bas = plus strict (0.35 très strict, 0.6 permissif). Conseillé : 0.40
# Des proches qui te ressemblent (frère, sœur) peuvent passer sous 0.45 :
# mesure avec `sudo faceauth measure` pour choisir le bon seuil.
tolerance = 0.40
# Nombre d'images reconnues nécessaires pour valider (3 = plus sûr).
min_matches = 3
# Visages interdits (faceauth block) : un visage plus proche d'un visage interdit que
# du tien, à cette marge près, est refusé. Plus grand = plus strict.
block_margin = 0.05
# Analyse de l'identité toutes les N images (plus grand = plus rapide, moins réactif).
identity_every = 4

[liveness]
# Défi anti-photo : none | blink | turn | both | strict
#   none  = aucun défi (déconseillé : une photo suffit)
#   blink = cligner des yeux
#   turn  = tourner la tête d'un côté tiré au hasard
#   both  = les deux (recommandé)
#   strict = clignement + rotation à gauche + rotation à droite, dans un ordre
#            aléatoire (le plus résistant aux vidéos ; un peu plus long)
challenge = both
# Temps maximum (secondes) avant de retomber sur le mot de passe.
timeout = 12
# Si aucun visage n'est vu au bout de N secondes, on passe directement au mot de
# passe (le champ s'affiche plus vite quand tu n'es pas devant la caméra).
no_face_timeout = 4
# true : seules les reconnaissances faites APRÈS les défis comptent (le visage
# reconnu doit être celui qui a réalisé les défis). Recommandé.
bind_identity = true
# Seuil de fermeture des yeux (EAR). Baisse-le si tes clignements ne sont pas détectés.
ear_threshold = 0.21
# Amplitude de rotation de la tête demandée (0.10 léger ... 0.25 marqué).
yaw_delta = 0.15
# IA anti-usurpation (optionnel) : un petit réseau de neurones (ONNX, ~600 Ko) juge si le
# visage est réel ou une photo / un écran. Complète les défis ; ne protège pas d'un masque 3D.
# Nécessite onnxruntime. Teste d'abord : faceauth antispoof
antispoof = false
# Probabilité minimale « visage réel » (0.05 à 0.99). Plus haut = plus strict (plus de
# refus du vrai visage). 0.5 est équilibré ; mesure-toi avec : faceauth antispoof
antispoof_threshold = 0.5
